[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not live and not voice_db"
filterwarnings =
    ignore:.*StarletteDeprecationWarning.*
    ignore:.*httpx.*starlette.testclient.*
markers =
    live: requires an isolated staging database or external provider
    voice_db: uses only the disposable local voice test database
