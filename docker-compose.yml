services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./apps/api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RELOAD: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set a Supabase public key in .env}}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  voice_agent:
    profiles: [voice]
    build: ./apps/api
    command: ["python", "-u", "-m", "app.agent.worker", "dev"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RELOAD: "false"
    volumes:
      - ./apps/api:/app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
